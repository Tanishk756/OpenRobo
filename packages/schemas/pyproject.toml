[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openrobo-schemas"
version = "0.1.0"
description = "OpenRobo Canonical JSON Schemas & Validation Utilities"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "jsonschema>=4.21.0",
    "pydantic>=2.6.0"
]

[tool.setuptools.packages.find]
where = ["."]

[project.optional-dependencies]
test = ["pytest"]

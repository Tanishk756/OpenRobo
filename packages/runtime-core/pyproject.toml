[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openrobo-runtime"
version = "0.6.1"
description = "OpenRobo Runtime Verification, Introspection, and Simulation Subsystem"
readme = "README.md"
authors = [{ name = "Tanishk Singhal" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

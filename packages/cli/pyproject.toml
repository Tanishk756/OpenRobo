[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openrobo-cli"
version = "0.1.0"
description = "OpenRobo Command Line Interface (CLI)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "openrobo-schemas",
    "openrobo-compat"
]

[project.scripts]
openrobo = "openrobo_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]

[project.optional-dependencies]
test = ["pytest"]

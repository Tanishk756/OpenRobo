version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: openrobo_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openrobo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openrobo_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-openrobo_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openrobo} -d ${POSTGRES_DB:-openrobo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:

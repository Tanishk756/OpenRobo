name: OpenRobo CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-checks:
    name: Python Lint, Schema & Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          python -m pip install -e packages/schemas -e packages/compat-engine -e packages/workspace-gen -e packages/runtime-core -e packages/release-core -e packages/agent-core -e packages/cli -e "apps/api[test]"

      - name: Run Ruff Linting
        run: python -m ruff check .

      - name: Validate Canonical Schemas
        run: python scripts/validate_schemas.py

      - name: Run Pytest Suite
        run: python -m pytest

  frontend-checks:
    name: Frontend Lint, Vitest & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Web Lint (ESLint)
        run: pnpm --filter openrobo-web run lint

      - name: Run Web Unit Tests (Vitest)
        run: pnpm --filter openrobo-web run test

      - name: Build Web Application (Next.js)
        run: pnpm --filter openrobo-web run build
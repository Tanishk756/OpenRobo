name: Schema Validation

on:
  push:
    paths:
      - 'schemas/**'
      - 'scripts/validate_schemas.py'
  pull_request:
    paths:
      - 'schemas/**'
      - 'scripts/validate_schemas.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install jsonschema
      - run: python3 scripts/validate_schemas.py

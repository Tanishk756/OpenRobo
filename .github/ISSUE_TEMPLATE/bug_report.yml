name: Bug Report
description: Create a report to help us reproduce and fix a bug in OpenRobo
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what went wrong...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment & Versions
      description: OS version, Python version, Node/pnpm version, and OpenRobo commit.
      placeholder: "Ubuntu 24.04 / Windows 11, Python 3.12, Node 20, commit abc1234"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run 'openrobo search ...'
        2. Inspect output...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or Terminal Output
      description: Relevant logs, stack traces, or error messages.
      render: shell
